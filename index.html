<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Prediction System</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #e6f7ff, #cce7ff);
            color: #003366;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px 50px;
        }

        h1 {
            text-align: center;
            color: #007acc;
            margin-bottom: 25px;
        }

        .symptom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px 20px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 10px;
            background: #f2f9ff;
            border: 1px solid #cce7ff;
            border-radius: 6px;
            transition: 0.3s;
        }

        label:hover {
            background-color: #e0f1ff;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
        }

        .submit-btn {
            display: block;
            margin: 35px auto 10px auto;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #005c99;
        }

        .symptom-grid::-webkit-scrollbar {
            width: 8px;
        }

        .symptom-grid::-webkit-scrollbar-thumb {
            background: #b3d9ff;
            border-radius: 10px;
        }

        .symptom-grid::-webkit-scrollbar-thumb:hover {
            background: #80c1ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🩺 Disease Prediction System</h1>

        <form action="/predict" method="post">
            <div class="symptom-grid">
                {% for symptom in symptoms %}
                <label>
                    <input type="checkbox" name="symptoms" value="{{ symptom }}">
                    {{ symptom.replace('_', ' ').title() }}
                </label>
                {% endfor %}
            </div>

            <button type="submit" class="submit-btn">Predict Disease</button>
        </form>
    </div>
</body>
</html>
